<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Team Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="./styles/index.css" />
    <script type="module" src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
  </head>
  <body x-data="app">
    <main>
      <header>
        <h1>🌍 Global Team Map 🌏</h1>
        <p>Add team members and see their locations on the map</p>
      </header>

      <div class="content">
        <div class="sidebar">
          <input
            x-ref="fileInput"
            type="file"
            accept=".json"
            @change="handleImport($event)"
            style="display: none"
          />
          <div class="team-list">
            <div class="header">
              <h2>
                Team Members (<span
                  x-text="$store.team.members?.length || 0"
                ></span
                >)
              </h2>
            </div>

            <template
              x-if="!$store.team.members || $store.team.members.length === 0"
            >
              <div class="empty-state">
                <p>
                  No team members yet. Add your first member to get started!
                </p>
              </div>
            </template>

            <div class="members-grid">
              <template
                x-for="member in $store.team.members.slice().sort((a, b) => a.name.localeCompare(b.name))"
                :key="member.id"
              >
                <div
                  class="member-card"
                  :class="{ 'selected': $store.team.selectedMemberId === member.id }"
                  @click="handleMemberClick(member.id)"
                >
                  <div class="member-header">
                    <div
                      class="member-avatar"
                      x-text="getInitials(member.name)"
                    ></div>
                    <div class="member-info">
                      <h3 x-text="member.name"></h3>
                      <p
                        x-show="member.role"
                        class="role"
                        x-text="member.role"
                      ></p>
                    </div>
                  </div>
                  <div class="member-details">
                    <p class="location">
                      📍 <span x-text="member.location"></span>
                    </p>
                    <p class="timezone">
                      🕐 <span x-text="member.timezone"></span>
                    </p>
                  </div>
                  <button
                    @click.stop="handleDeleteClick(member.id)"
                    class="delete-btn"
                    title="Delete member"
                  >
                    🗑️
                  </button>
                </div>
              </template>
            </div>
          </div>
          <button @click="$refs.dialog.showModal()" class="btn-add-member">
            + Add Team Member
          </button>
          <div class="share-buttons">
            <button
              @click="handleExport()"
              class="btn-share"
              title="Export team data"
            >
              📥 Export
            </button>
            <button
              @click="$refs.fileInput.click()"
              class="btn-share"
              title="Import team data"
            >
              📤 Import
            </button>
            <button
              @click="handleCopy()"
              class="btn-share"
              title="Copy team data"
            >
              📋 Copy
            </button>
          </div>
        </div>

        <div class="map-container">
          <div id="map"></div>
        </div>
      </div>
    </main>

    <dialog x-ref="dialog" @close="resetForm()">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2>Add Team Member</h2>
          <button
            @click="$refs.dialog.close()"
            class="btn-close"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <form @submit.prevent="handleAddMember($event)">
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              x-model="form.name"
              required
              placeholder="Enter name"
            />
          </div>
          <div class="form-group">
            <label for="role">Role</label>
            <input
              type="text"
              x-model="form.role"
              placeholder="e.g., Developer, Designer"
            />
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <div x-data="locationSearch" class="location-search-wrapper">
              <input
                type="text"
                x-model="query"
                @input.debounce.500ms="search()"
                placeholder="Search for a location..."
                class="location-input"
                required
              />
              <ul x-show="results.length > 0" class="location-results">
                <template x-for="result in results" :key="result.place_id">
                  <li
                    @click="selectLocation(result)"
                    x-text="result.display_name"
                  ></li>
                </template>
              </ul>
            </div>
          </div>
          <div class="form-group">
            <label for="latitude">Latitude</label>
            <input
              type="number"
              x-model="form.latitude"
              step="any"
              required
              placeholder="Auto-filled from location"
              readonly
            />
          </div>
          <div class="form-group">
            <label for="longitude">Longitude</label>
            <input
              type="number"
              x-model="form.longitude"
              step="any"
              required
              placeholder="Auto-filled from location"
              readonly
            />
          </div>
          <button
            type="submit"
            class="btn-primary"
            :disabled="isSubmitting"
            :class="{ 'loading': isSubmitting }"
            x-text="isSubmitting ? 'Adding member...' : 'Add Member'"
          ></button>
        </form>
      </div>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </body>
</html>
