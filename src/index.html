<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Team Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🌍 Global Team Map 🌏</h1>
        <p>Add team members and see their locations on the map</p>
      </header>

      <div class="content">
        <div class="sidebar">
          <div class="team-list">
            <div class="share-buttons">
              <button id="exportBtn" class="btn-share" title="Export team data">
                📥 Export
              </button>
              <button id="importBtn" class="btn-share" title="Import team data">
                📤 Import
              </button>
              <button id="copyBtn" class="btn-share" title="Copy team data">
                📋 Copy
              </button>
            </div>
            <input
              type="file"
              id="fileInput"
              accept=".json"
              style="display: none"
            />
            <team-member-list id="memberList"></team-member-list>
            <button id="openFormBtn" class="btn-add-member">
              + Add Team Member
            </button>
          </div>
        </div>

        <div class="map-container">
          <div id="map"></div>
        </div>
      </div>
    </div>

    <dialog id="memberFormDialog">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2>Add Team Member</h2>
          <button id="closeDialogBtn" class="btn-close" aria-label="Close">
            ✕
          </button>
        </div>
        <form id="memberForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required placeholder="Enter name" />
          </div>
          <div class="form-group">
            <label for="role">Role</label>
            <input
              type="text"
              id="role"
              placeholder="e.g., Developer, Designer"
            />
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <location-search id="locationSearch" required></location-search>
          </div>
          <div class="form-group">
            <label for="latitude">Latitude</label>
            <input
              type="number"
              id="latitude"
              step="any"
              required
              placeholder="Auto-filled from location"
              readonly
            />
          </div>
          <div class="form-group">
            <label for="longitude">Longitude</label>
            <input
              type="number"
              id="longitude"
              step="any"
              required
              placeholder="Auto-filled from location"
              readonly
            />
          </div>
          <button type="submit" class="btn-primary">Add Member</button>
        </form>
      </div>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
