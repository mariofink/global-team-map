<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Team Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🌍 Global Team Map</h1>
        <p>Add team members and see their locations on the map</p>
      </header>

      <div class="content">
        <div class="sidebar">
          <div class="add-member-form">
            <h2>Add Team Member</h2>
            <form id="memberForm">
              <div class="form-group">
                <label for="name">Name</label>
                <input
                  type="text"
                  id="name"
                  required
                  placeholder="Enter name"
                />
              </div>
              <div class="form-group">
                <label for="role">Role</label>
                <input
                  type="text"
                  id="role"
                  placeholder="e.g., Developer, Designer"
                />
              </div>
              <div class="form-group">
                <label for="location">Location</label>
                <div class="location-search-wrapper">
                  <input
                    type="text"
                    id="location"
                    required
                    placeholder="Search for a location..."
                    autocomplete="off"
                  />
                  <div
                    id="locationSuggestions"
                    class="location-suggestions"
                  ></div>
                </div>
              </div>
              <div class="form-group">
                <label for="latitude">Latitude</label>
                <input
                  type="number"
                  id="latitude"
                  step="any"
                  required
                  placeholder="Auto-filled from location"
                  readonly
                />
              </div>
              <div class="form-group">
                <label for="longitude">Longitude</label>
                <input
                  type="number"
                  id="longitude"
                  step="any"
                  required
                  placeholder="Auto-filled from location"
                  readonly
                />
              </div>
              <button type="submit" class="btn-primary">Add Member</button>
            </form>
          </div>

          <div class="team-list">
            <div class="team-list-header">
              <h2>Team Members (<span id="memberCount">0</span>)</h2>
            </div>
            <div class="share-buttons">
              <button id="exportBtn" class="btn-share" title="Export team data">
                📥 Export
              </button>
              <button id="importBtn" class="btn-share" title="Import team data">
                📤 Import
              </button>
              <button id="copyBtn" class="btn-share" title="Copy team data">
                📋 Copy
              </button>
            </div>
            <input
              type="file"
              id="fileInput"
              accept=".json"
              style="display: none"
            />
            <div id="membersList"></div>
          </div>
        </div>

        <div class="map-container">
          <div id="map"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
